<!doctype html>
<html lang="{{locale}}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><meta name="supported-color-schemes" content="light dark"><title>{{subject}}</title>
<style>:root{color-scheme:light dark;supported-color-schemes:light dark}a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;font:inherit!important}@media (prefers-color-scheme:dark){.page{background-color:{{dark_page_color}}!important}.surface{background-color:{{dark_surface_color}}!important}.text{color:{{dark_text_color}}!important}.muted{color:{{dark_muted_color}}!important}}</style></head>
<body class="page" style="margin:0;background-color:{{page_color}};color:{{text_color}};font-family:Arial,Helvetica,sans-serif">
<div style="display:none;max-height:0;overflow:hidden;mso-hide:all">{{preview}}</div>
<table class="page" role="presentation" width="100%" cellspacing="0" cellpadding="0" bgcolor="{{page_color}}"><tr><td align="center" style="padding:32px 16px">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px">
<tr><td class="text" style="padding-bottom:24px;font-size:24px;font-weight:700;color:{{text_color}}">{{brand_name}}</td></tr>
<tr><td class="surface" bgcolor="{{surface_color}}" style="padding:32px 24px;border-radius:12px">
<h1 class="text" style="margin:0 0 16px;font-size:28px;line-height:1.2;color:{{text_color}}">{{heading}}</h1>
<p class="text" style="margin:0;font-size:16px;line-height:1.6;color:{{text_color}}">{{body}}</p>
<!-- Keep the code block for code-entry emails, or the action block for link-based emails. -->
<p style="padding:20px 8px;text-align:center;background-color:{{accent_color}};color:{{action_text_color}};font-size:32px;font-weight:700;letter-spacing:6px">{{code}}</p>
<table role="presentation" cellspacing="0" cellpadding="0" style="margin-top:24px"><tr><td bgcolor="{{accent_color}}" style="border-radius:8px"><a href="{{action_url}}" style="display:inline-block;padding:16px 24px;font-size:16px;font-weight:700;color:{{action_text_color}};text-decoration:none">{{action_label}}</a></td></tr></table>
<p class="muted" style="margin:24px 0 0;font-size:14px;line-height:1.6;color:{{muted_color}}">{{note}}</p>
</td></tr>
<tr><td class="muted" style="padding-top:24px;font-size:13px;line-height:1.6;color:{{muted_color}}">{{brand_name}} · <a href="mailto:{{support_email}}" style="color:{{link_color}};text-decoration:underline">{{support_email}}</a></td></tr>
</table></td></tr></table>
</body></html>
