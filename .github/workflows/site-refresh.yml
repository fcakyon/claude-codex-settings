name: Website daily refresh

# Rebuild both sites daily so GitHub stars and release ZIP counts stay current.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Rebuild and deploy
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - name: Deploy claudesettings.com
        env:
          PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.CLAUDESETTINGS_GOOGLE_ANALYTICS_ID }}
          SITE_VARIANT: settings
        run: |
          npm run build --prefix site
          npx --yes wrangler deploy --config wrangler.claudesettings.jsonc
      - name: Deploy agentplugins.net
        env:
          PUBLIC_GOOGLE_ANALYTICS_ID: ${{ vars.AGENTPLUGINS_GOOGLE_ANALYTICS_ID }}
          SITE_VARIANT: plugins
        run: |
          npm run build --prefix site
          npx --yes wrangler deploy --config wrangler.agentplugins.jsonc
