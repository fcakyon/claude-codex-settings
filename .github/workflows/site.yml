name: Website

# The daily run keeps GitHub stars and release ZIP counts current. Keep this the only
# deployer: Cloudflare's Git builds had no GitHub token and raced these deploys.

on:
  push:
    branches: [main]
    paths: &site-paths
      - "site/**"
      - ".claude/CLAUDE.md"
      - ".claude/settings*.json"
      - ".claude-plugin/marketplace.json"
      - ".agents/plugins/marketplace.json"
      - ".cursor-plugin/marketplace.json"
      - "plugins/**"
      - ".codex/config.toml"
      - ".codex/config-*.toml"
      - "INSTALL.md"
      - "wrangler.*.jsonc"
      - ".github/workflows/site.yml"
  pull_request:
    branches: [main]
    paths: *site-paths
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  site:
    name: ${{ matrix.site }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: claudesettings
            variant: settings
            analytics: ${{ vars.CLAUDESETTINGS_GOOGLE_ANALYTICS_ID }}
          - site: agentplugins
            variant: plugins
            analytics: ${{ vars.AGENTPLUGINS_GOOGLE_ANALYTICS_ID }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PUBLIC_GOOGLE_ANALYTICS_ID: ${{ matrix.analytics }}
      SITE_VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run build --prefix site
      - if: github.ref == 'refs/heads/main'
        run: npx --yes wrangler deploy --config wrangler.${{ matrix.site }}.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
